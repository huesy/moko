# JS/TS workspace. apps/agent is Python (no package.json) and is ignored here.
packages:
  - "apps/*"
  - "packages/*"

# Force patched transitive deps (Dependabot). pnpm 11 reads overrides from this
# file, not package.json's "pnpm" field.
overrides:
  postcss: "8.5.25"
  sharp: "0.35.3"
  svgo: "4.0.2"
  js-yaml: "4.3.1"
  esbuild: "0.28.1"

# Dependencies allowed to run install/build scripts (pnpm blocks them by
# default). esbuild = Astro's bundler; sharp = image optimization.
allowBuilds:
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - esbuild
  - sharp
