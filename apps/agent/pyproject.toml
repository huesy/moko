[project]
name = "moko"
dynamic = ["version"] # derived from the git tag by hatch-vcs (see [tool.hatch.version])
description = "A warm, curious personal AI entity with a structured memory graph."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Andrew Hughes" }]
keywords = ["ai", "assistant", "agent", "personal-knowledge", "memory-graph", "companion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies grow with the milestones that need them.
#   M0 (setup + time):
#     - questionary:    keyboard-navigable prompts (arrows / ENTER / SPACE)
#     - rich:           warm, pink-accented terminal output
#     (`moko chat`'s input is our own tui/ framework — no extra dependency)
#     - pyyaml:         the on-disk config under ~/.moko/
#     - tzdata:         so timezone lookups work everywhere
#   M1 (the mind / graph store):
#     - aiosqlite:   async SQLite — Moko's memory
#     - python-ulid: sortable, time-bearing ids
#   M2 (the brain):
#     - anthropic:   Claude SDK
#     - openai:      OpenAI + OpenAI-compatible (xAI Grok) SDK
# M3 will add the channel libraries.
#   Monitor (local observability dashboard):
#     - aiohttp:     localhost HTTP server for the status API + SSE event stream
dependencies = [
    "questionary>=2.0",
    "rich>=13.9",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "aiosqlite>=0.20",
    "python-ulid>=2.7",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "piexif>=1.1.3",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://mokomoko.ai"
Documentation = "https://mokomoko.ai/docs/"
Repository = "https://github.com/huesy/moko"
Issues = "https://github.com/huesy/moko/issues"

[project.scripts]
moko = "moko.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the git tag (e.g. tag `v0.1.0` → version `0.1.0`). The package
# lives at apps/agent but the git repo is the monorepo root, two levels up, so point
# setuptools-scm there. A source build (uv tool install --from git+…) clones the whole
# repo, so .git is present; CI (release.yml) checks out with fetch-depth: 0 for tags.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/moko"]
# Non-.py package data (migration .sql files, built-in skill .md files, the
# bundled Moko character-reference image under assets/) is included automatically
# by hatchling as it lives inside the package.
# The built monitor dashboard is a build ARTIFACT (gitignored, not committed — see
# scripts/build-monitor.sh). `artifacts` force-includes it in the wheel when present:
# CI (release.yml) vendors it before `uv build`, so release wheels carry the UI; a
# plain source build with no vendored UI simply ships without it.
artifacts = ["src/moko/monitor/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, SIM = simplify, ASYNC = async-correctness (blocking I/O on the loop).
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
# Locale catalogues are data: translated prose lives on one line per key, so the
# line-length limit doesn't apply (wrapping a sentence mid-string is worse).
"src/moko/i18n/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
